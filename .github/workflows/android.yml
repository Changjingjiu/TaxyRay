name: Android checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-and-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            core/build/reports/
  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          # 该 action 逐行执行 script Compose 偶发中断时重跑一次 真失败第二次仍会失败
          script: ./gradlew :app:connectedDebugAndroidTest || ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: app/build/reports/androidTests/
